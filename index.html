<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Full-Page Sections</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
            cursor: url('https://cur.cursors-4u.net/animals/ani-3/ani264.cur'), auto;
        }

        /* Full-page sections */
        .section {
            height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            text-align: center;
        }

        /* Hero Section */
        .hero {
            background-image: url('your-hero-image.png');
            background-size: cover;
            background-position: center;
            background-attachment: scroll;
        }

        /* Logo on Hero */
        .logo {
            max-width: 80%;
            height: auto;
            z-index: 2;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.2s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Second Section */
        .second-section {
            background-image: url('section2.png');
            background-size: cover;
            background-position: center;
            background-attachment: scroll;
        }

        /* Third Section */
        .third-section {
            background-image: url('your-second-image.png');
            background-size: cover;
            background-position: center;
            background-attachment: scroll;
        }

        /* Fourth Section: Map + Text */
        .map-section {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            background-image: url('section2.png');
            background-size: cover;
            background-position: center;
            background-attachment: scroll;
            padding: 60px;
            gap: 60px;
        }

        .map-container {
            width: 380px;
            height: 320px;
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .map-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            background-color: rgba(255, 255, 255, 0.75);
            padding: 40px;
            border-radius: 12px;
            color: #333;
            max-width: 400px;
        }

        .map-text h2 {
            font-size: 2.5rem;
            font-family: 'Playfair Display', serif;
        }

        .map-text p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #555;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .logo {
                max-width: 90%;
            }

            .section {
                background-attachment: scroll !important;
            }

            .hero, .second-section, .third-section, .map-section {
                background-size: cover;
                background-position: center center;
            }

            .map-section {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                padding: 40px 20px;
                justify-content: center;
            }

            .map-container {
                width: 100%;
                height: 260px;
            }

            .map-text {
                max-width: 100%;
                padding: 30px 20px;
            }
        }

        /* Extra small devices */
        @media (max-width: 480px) {
            .logo {
                max-width: 95%;
            }
        }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <section class="section hero">
        <img src="your-logo.png" alt="Your Logo" class="logo">
    </section>

    <!-- Second Section -->
    <section class="section second-section">
    </section>

    <!-- Third Section -->
    <section class="section third-section">
    </section>

    <!-- Fourth Section: Map + Text -->
    <section class="section map-section">
        <div class="map-container">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1388.8922147329654!2d12.617140550778824!3d42.23640532251591!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sit!2ses!4v1772620542089!5m2!1sit!2ses"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
        <div class="map-text">
            <h2>Find Us Here</h2>
            <p>Torrita Tiberina, Rome, Italy</p>
            <p>Your description or contact info goes here.</p>
        </div>
    </section>

</body>
</html>
